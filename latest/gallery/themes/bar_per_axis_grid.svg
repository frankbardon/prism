<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" overflow="hidden">
  <style>:root{--prism-color-axis:#6b7280;--prism-color-grid:#e5e7eb;--prism-color-text:#111827;--prism-color-bg:transparent;--prism-font-sans:Inter, system-ui, sans-serif;--prism-font-mono:ui-monospace, SF Mono, monospace;--prism-font-size-label:11px;--prism-font-size-title:16px;--prism-font-size-axis-title:12px;--prism-axis-domain-color:#6b7280;--prism-axis-domain-width:1px;--prism-axis-tick-color:#6b7280;--prism-axis-tick-width:1px;--prism-axis-tick-size:5px;--prism-grid-color:#cbd5e1;--prism-grid-width:1px;--prism-axis-label-color:#111827;--prism-axis-label-font-size:11px;--prism-axis-label-padding:4px;--prism-axis-title-color:#111827;--prism-axis-title-font-size:12px;--prism-axis-title-padding:8px;--prism-legend-padding:8px;--prism-legend-symbol-size:64px;--prism-legend-label-color:#111827;--prism-legend-label-font-size:11px;--prism-legend-title-color:#111827;--prism-legend-title-font-size:12px;--prism-legend-title-font-weight:600;--prism-legend-row-padding:4px;--prism-title-color:#111827;--prism-title-font-size:16px;--prism-title-font-weight:600;--prism-title-anchor:start;--prism-title-padding:12px;--prism-view-bg:transparent;--prism-view-padding:0px;--prism-mark-fill:#4c78a8;--prism-mark-stroke-width:0px;--prism-mark-opacity:1;--prism-mark-bar-fill:#4c78a8;--prism-mark-bar-corner-radius:0px;--prism-deselected-opacity:0.3;--prism-selected-opacity:1;}.prism-axis-domain{stroke:var(--prism-axis-domain-color,var(--prism-color-axis));stroke-width:var(--prism-axis-domain-width,1px);fill:none;}.prism-axis-tick{stroke:var(--prism-axis-tick-color,var(--prism-color-axis));stroke-width:var(--prism-axis-tick-width,1px);}.prism-axis-label{fill:var(--prism-axis-label-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-axis-label-font-size,var(--prism-font-size-label,11px));font-weight:var(--prism-axis-label-font-weight,400);}.prism-axis-title{fill:var(--prism-axis-title-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-axis-title-font-size,var(--prism-font-size-axis-title,12px));font-weight:var(--prism-axis-title-font-weight,600);}.prism-grid-line{stroke:var(--prism-grid-color,var(--prism-color-grid));stroke-width:var(--prism-grid-width,1px);}.prism-title{fill:var(--prism-title-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-title-font-size,var(--prism-font-size-title,16px));font-weight:var(--prism-title-font-weight,600);}.prism-legend-title{fill:var(--prism-legend-title-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-legend-title-font-size,12px);font-weight:var(--prism-legend-title-font-weight,600);}.prism-legend-label{fill:var(--prism-legend-label-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-legend-label-font-size,11px);}.prism-legend-swatch{stroke:none;}.prism-selected{opacity:var(--prism-selected-opacity,1);}.prism-deselected{opacity:var(--prism-deselected-opacity,0.3);}.prism-axis-x{--prism-grid-color:#f59e0b;--prism-grid-dash:4,3;}.prism-axis-y{--prism-grid-color:#94a3b8;--prism-axis-title-padding:2px;}</style>

  <g class="prism-scene" data-scene-id="scene-0">
    <text class="prism-title" x="410" y="20" text-anchor="middle">Quarterly revenue — vertical and horizontal grid lines themed apart (axis_x / axis_y)</text>
    <g class="prism-axes">
      <g class="prism-axis prism-axis-x" data-prism-axis-id="x-axis"><line class="prism-grid-line" x1="132.5" y1="50" x2="132.5" y2="560"/><line class="prism-grid-line" x1="317.5" y1="50" x2="317.5" y2="560"/><line class="prism-grid-line" x1="502.5" y1="50" x2="502.5" y2="560"/><line class="prism-grid-line" x1="687.5" y1="50" x2="687.5" y2="560"/><line class="prism-axis-domain" x1="40" y1="560" x2="780" y2="560"/><line class="prism-axis-tick" x1="132.5" y1="560" x2="132.5" y2="565"/><text class="prism-axis-label" x="132.5" y="578" text-anchor="middle">Q1</text><line class="prism-axis-tick" x1="317.5" y1="560" x2="317.5" y2="565"/><text class="prism-axis-label" x="317.5" y="578" text-anchor="middle">Q2</text><line class="prism-axis-tick" x1="502.5" y1="560" x2="502.5" y2="565"/><text class="prism-axis-label" x="502.5" y="578" text-anchor="middle">Q3</text><line class="prism-axis-tick" x1="687.5" y1="560" x2="687.5" y2="565"/><text class="prism-axis-label" x="687.5" y="578" text-anchor="middle">Q4</text><text class="prism-axis-title" x="410" y="594" text-anchor="middle">Quarter</text></g>
      <g class="prism-axis prism-axis-y" data-prism-axis-id="y-axis"><line class="prism-grid-line" x1="40" y1="560" x2="780" y2="560"/><line class="prism-grid-line" x1="40" y1="458" x2="780" y2="458"/><line class="prism-grid-line" x1="40" y1="356" x2="780" y2="356"/><line class="prism-grid-line" x1="40" y1="254" x2="780" y2="254"/><line class="prism-grid-line" x1="40" y1="152" x2="780" y2="152"/><line class="prism-grid-line" x1="40" y1="50" x2="780" y2="50"/><line class="prism-axis-domain" x1="40" y1="50" x2="40" y2="560"/><line class="prism-axis-tick" x1="40" y1="560" x2="35" y2="560"/><text class="prism-axis-label" x="32" y="564" text-anchor="end">0</text><line class="prism-axis-tick" x1="40" y1="509" x2="37" y2="509"/><line class="prism-axis-tick" x1="40" y1="458" x2="35" y2="458"/><text class="prism-axis-label" x="32" y="462" text-anchor="end">20</text><line class="prism-axis-tick" x1="40" y1="407" x2="37" y2="407"/><line class="prism-axis-tick" x1="40" y1="356" x2="35" y2="356"/><text class="prism-axis-label" x="32" y="360" text-anchor="end">40</text><line class="prism-axis-tick" x1="40" y1="305" x2="37" y2="305"/><line class="prism-axis-tick" x1="40" y1="254" x2="35" y2="254"/><text class="prism-axis-label" x="32" y="258" text-anchor="end">60</text><line class="prism-axis-tick" x1="40" y1="203" x2="37" y2="203"/><line class="prism-axis-tick" x1="40" y1="152" x2="35" y2="152"/><text class="prism-axis-label" x="32" y="156" text-anchor="end">80</text><line class="prism-axis-tick" x1="40" y1="101" x2="37" y2="101"/><line class="prism-axis-tick" x1="40" y1="50" x2="35" y2="50"/><text class="prism-axis-label" x="32" y="54" text-anchor="end">100</text><text class="prism-axis-title" x="2" y="305" text-anchor="middle" transform="rotate(-90 2 305)">Revenue</text></g>
    </g>
    <g class="prism-plot">
      <g class="prism-layer" data-layer-id="layer-0" data-prism-layer="layer-0">
        <rect class="prism-mark-bar" data-prism-id="bar-0" data-prism-datum-row="0" x="49.25" y="243.8" width="166.5" height="316.2" fill="#4c78a8"/>
        <rect class="prism-mark-bar" data-prism-id="bar-1" data-prism-datum-row="1" x="234.25" y="197.9" width="166.5" height="362.1" fill="#4c78a8"/>
        <rect class="prism-mark-bar" data-prism-id="bar-2" data-prism-datum-row="2" x="419.25" y="223.4" width="166.5" height="336.6" fill="#4c78a8"/>
        <rect class="prism-mark-bar" data-prism-id="bar-3" data-prism-datum-row="3" x="604.25" y="111.2" width="166.5" height="448.8" fill="#4c78a8"/>
      </g>
    </g>
  </g>
</svg>
