      </g>
    </g>
  </g>

  <g class="prism-axes" data-shared="true">
    <g class="prism-axis prism-axis-x" data-prism-axis-id="x-axis"><line class="prism-axis-domain" x1="40" y1="70" x2="658" y2="70"/><line class="prism-axis-tick" x1="143" y1="70" x2="143" y2="65"/><text class="prism-axis-label" x="143" y="62" text-anchor="middle">x</text><line class="prism-axis-tick" x1="349" y1="70" x2="349" y2="65"/><text class="prism-axis-label" x="349" y="62" text-anchor="middle">y</text><line class="prism-axis-tick" x1="555" y1="70" x2="555" y2="65"/><text class="prism-axis-label" x="555" y="62" text-anchor="middle">z</text><text class="prism-axis-title" x="349" y="42" text-anchor="middle">col</text></g>
    <g class="prism-axis prism-axis-y" data-prism-axis-id="y-axis"><line class="prism-axis-domain" x1="40" y1="70" x2="40" y2="160"/><line class="prism-axis-tick" x1="40" y1="85" x2="35" y2="85"/><text class="prism-axis-label" x="32" y="89" text-anchor="end">r1</text><line class="prism-axis-tick" x1="40" y1="115" x2="35" y2="115"/><text class="prism-axis-label" x="32" y="119" text-anchor="end">r2</text><line class="prism-axis-tick" x1="40" y1="145" x2="35" y2="145"/><text class="prism-axis-label" x="32" y="149" text-anchor="end">Key</text><text class="prism-axis-title" x="10" y="115" text-anchor="middle" transform="rotate(-90 10 115)">row</text></g>
  </g>
</svg>
