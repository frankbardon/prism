        <rect class="prism-mark-bar" data-prism-id="heatmap-1" data-prism-datum-row="1" x="256.3" y="71.5" width="185.4" height="27" fill="#f7ba9d"/>
        <rect class="prism-mark-bar" data-prism-id="heatmap-2" data-prism-datum-row="2" x="462.3" y="71.5" width="185.4" height="27" fill="#d8e8f1"/>
        <rect class="prism-mark-bar" data-prism-id="heatmap-3" data-prism-datum-row="3" x="50.3" y="101.5" width="185.4" height="27" fill="#b2182b"/>
        <rect class="prism-mark-bar" data-prism-id="heatmap-4" data-prism-datum-row="4" x="256.3" y="101.5" width="185.4" height="27" fill="#72b0d3"/>
        <rect class="prism-mark-bar" data-prism-id="heatmap-5" data-prism-datum-row="5" x="462.3" y="101.5" width="185.4" height="27" fill="#f7f7f7"/>
        <rect class="prism-mark-bar" data-prism-id="heatmap-6" data-prism-datum-row="6" x="50.3" y="131.5" width="185.4" height="27" fill="#b2182b"/>
        <rect class="prism-mark-bar" data-prism-id="heatmap-7" data-prism-datum-row="7" x="256.3" y="131.5" width="185.4" height="27" fill="#f7f7f7"/>
        <rect class="prism-mark-bar" data-prism-id="heatmap-8" data-prism-datum-row="8" x="462.3" y="131.5" width="185.4" height="27" fill="#2166ac"/>
      </g>
      <g class="prism-layer" data-layer-id="layer-1" data-prism-layer="layer-1">
        <text class="prism-mark-text" data-prism-id="text-0" data-prism-datum-row="0" x="143" y="145" text-anchor="middle" font-size="11" fill="#111827">-0.5</text>
