        <circle class="prism-mark-point" data-prism-id="point-2" data-prism-datum-row="2" cx="428.5" cy="123.92" r="5.352" fill="#4c78a8"/>
        <circle class="prism-mark-point" data-prism-id="point-3" data-prism-datum-row="3" cx="428.5" cy="271.76" r="5.352" fill="#f58518"/>
      </g>
