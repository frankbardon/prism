<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" overflow="hidden">
  <style>:root{--prism-color-axis:#6b7280;--prism-color-grid:#e5e7eb;--prism-color-text:#111827;--prism-color-bg:transparent;--prism-font-sans:Inter, system-ui, sans-serif;--prism-font-mono:ui-monospace, SF Mono, monospace;--prism-font-size-label:11px;--prism-font-size-title:16px;--prism-font-size-axis-title:12px;--prism-axis-domain-color:#6b7280;--prism-axis-domain-width:1px;--prism-axis-tick-color:#6b7280;--prism-axis-tick-width:1px;--prism-axis-tick-size:5px;--prism-grid-color:#e5e7eb;--prism-grid-width:1px;--prism-axis-label-color:#111827;--prism-axis-label-font-size:11px;--prism-axis-label-padding:4px;--prism-axis-title-color:#111827;--prism-axis-title-font-size:12px;--prism-axis-title-padding:8px;--prism-legend-padding:8px;--prism-legend-symbol-size:64px;--prism-legend-label-color:#111827;--prism-legend-label-font-size:11px;--prism-legend-title-color:#111827;--prism-legend-title-font-size:12px;--prism-legend-title-font-weight:600;--prism-legend-row-padding:4px;--prism-title-color:#111827;--prism-title-font-size:16px;--prism-title-font-weight:600;--prism-title-anchor:start;--prism-title-padding:12px;--prism-view-bg:transparent;--prism-view-padding:0px;--prism-mark-fill:#4c78a8;--prism-mark-stroke-width:0px;--prism-mark-opacity:1;--prism-mark-bar-fill:#4c78a8;--prism-mark-bar-corner-radius:0px;--prism-deselected-opacity:0.3;--prism-selected-opacity:1;}.prism-axis-domain{stroke:var(--prism-axis-domain-color,var(--prism-color-axis));stroke-width:var(--prism-axis-domain-width,1px);fill:none;}.prism-axis-tick{stroke:var(--prism-axis-tick-color,var(--prism-color-axis));stroke-width:var(--prism-axis-tick-width,1px);}.prism-axis-label{fill:var(--prism-axis-label-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-axis-label-font-size,var(--prism-font-size-label,11px));font-weight:var(--prism-axis-label-font-weight,400);}.prism-axis-title{fill:var(--prism-axis-title-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-axis-title-font-size,var(--prism-font-size-axis-title,12px));font-weight:var(--prism-axis-title-font-weight,600);}.prism-grid-line{stroke:var(--prism-grid-color,var(--prism-color-grid));stroke-width:var(--prism-grid-width,1px);}.prism-title{fill:var(--prism-title-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-title-font-size,var(--prism-font-size-title,16px));font-weight:var(--prism-title-font-weight,600);}.prism-legend-title{fill:var(--prism-legend-title-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-legend-title-font-size,12px);font-weight:var(--prism-legend-title-font-weight,600);}.prism-legend-label{fill:var(--prism-legend-label-color,var(--prism-color-text));font-family:var(--prism-font-sans);font-size:var(--prism-legend-label-font-size,11px);}.prism-legend-swatch{stroke:none;}.prism-selected{opacity:var(--prism-selected-opacity,1);}.prism-deselected{opacity:var(--prism-deselected-opacity,0.3);}</style>

  <g class="prism-scene" data-scene-id="scene-0">
    <text class="prism-title" x="410" y="20" text-anchor="middle">Green for high scores, red for negatives</text>
    <g class="prism-axes">
      <g class="prism-axis prism-axis-x" data-prism-axis-id="x-axis"><line class="prism-grid-line" x1="114" y1="50" x2="114" y2="560"/><line class="prism-grid-line" x1="262" y1="50" x2="262" y2="560"/><line class="prism-grid-line" x1="410" y1="50" x2="410" y2="560"/><line class="prism-grid-line" x1="558" y1="50" x2="558" y2="560"/><line class="prism-grid-line" x1="706" y1="50" x2="706" y2="560"/><line class="prism-axis-domain" x1="40" y1="560" x2="780" y2="560"/><line class="prism-axis-tick" x1="114" y1="560" x2="114" y2="565"/><text class="prism-axis-label" x="114" y="578" text-anchor="middle">west</text><line class="prism-axis-tick" x1="262" y1="560" x2="262" y2="565"/><text class="prism-axis-label" x="262" y="578" text-anchor="middle">east</text><line class="prism-axis-tick" x1="410" y1="560" x2="410" y2="565"/><text class="prism-axis-label" x="410" y="578" text-anchor="middle">north</text><line class="prism-axis-tick" x1="558" y1="560" x2="558" y2="565"/><text class="prism-axis-label" x="558" y="578" text-anchor="middle">south</text><line class="prism-axis-tick" x1="706" y1="560" x2="706" y2="565"/><text class="prism-axis-label" x="706" y="578" text-anchor="middle">central</text><text class="prism-axis-title" x="410" y="594" text-anchor="middle">region</text></g>
      <g class="prism-axis prism-axis-y" data-prism-axis-id="y-axis"><line class="prism-grid-line" x1="40" y1="560" x2="780" y2="560"/><line class="prism-grid-line" x1="40" y1="458" x2="780" y2="458"/><line class="prism-grid-line" x1="40" y1="356" x2="780" y2="356"/><line class="prism-grid-line" x1="40" y1="254" x2="780" y2="254"/><line class="prism-grid-line" x1="40" y1="152" x2="780" y2="152"/><line class="prism-grid-line" x1="40" y1="50" x2="780" y2="50"/><line class="prism-axis-domain" x1="40" y1="50" x2="40" y2="560"/><line class="prism-axis-tick" x1="40" y1="560" x2="35" y2="560"/><text class="prism-axis-label" x="32" y="564" text-anchor="end">-0.2</text><line class="prism-axis-tick" x1="40" y1="509" x2="37" y2="509"/><line class="prism-axis-tick" x1="40" y1="458" x2="35" y2="458"/><text class="prism-axis-label" x="32" y="462" text-anchor="end">0</text><line class="prism-axis-tick" x1="40" y1="407" x2="37" y2="407"/><line class="prism-axis-tick" x1="40" y1="356" x2="35" y2="356"/><text class="prism-axis-label" x="32" y="360" text-anchor="end">0.2</text><line class="prism-axis-tick" x1="40" y1="305" x2="37" y2="305"/><line class="prism-axis-tick" x1="40" y1="254" x2="35" y2="254"/><text class="prism-axis-label" x="32" y="258" text-anchor="end">0.4</text><line class="prism-axis-tick" x1="40" y1="203" x2="37" y2="203"/><line class="prism-axis-tick" x1="40" y1="152" x2="35" y2="152"/><text class="prism-axis-label" x="32" y="156" text-anchor="end">0.6</text><line class="prism-axis-tick" x1="40" y1="101" x2="37" y2="101"/><line class="prism-axis-tick" x1="40" y1="50" x2="35" y2="50"/><text class="prism-axis-label" x="32" y="54" text-anchor="end">0.8</text><text class="prism-axis-title" x="10" y="305" text-anchor="middle" transform="rotate(-90 10 305)">delta</text></g>
    </g>
    <g class="prism-plot">
      <g class="prism-layer" data-layer-id="layer-0" data-prism-layer="layer-0">
        <rect class="prism-mark-bar" data-prism-id="bar-0" data-prism-datum-row="0" x="47.4" y="458" width="133.2" height="61.2" fill="#ef4444"/>
        <rect class="prism-mark-bar" data-prism-id="bar-1" data-prism-datum-row="1" x="195.4" y="284.6" width="133.2" height="173.4" fill="#94a3b8"/>
        <rect class="prism-mark-bar" data-prism-id="bar-2" data-prism-datum-row="2" x="343.4" y="60.2" width="133.2" height="397.8" fill="#22c55e"/>
        <rect class="prism-mark-bar" data-prism-id="bar-3" data-prism-datum-row="3" x="491.4" y="458" width="133.2" height="25.5" fill="#ef4444"/>
        <rect class="prism-mark-bar" data-prism-id="bar-4" data-prism-datum-row="4" x="639.4" y="366.2" width="133.2" height="91.8" fill="#94a3b8"/>
      </g>
    </g>
  </g>
</svg>
