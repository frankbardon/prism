<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Prism chart</title>
<style>html,body{margin:0;padding:0}.prism-html-table{border-collapse:collapse}.prism-html-table th,.prism-html-table td{padding:4px 8px;text-align:left;vertical-align:middle}.prism-html-table th{cursor:pointer;user-select:none}.prism-html-table-pagination{display:flex;align-items:center;gap:8px;padding:4px 8px}.prism-html-table tr.prism-selected{background:rgba(76,120,168,0.15)}</style>
</head>
<body>
<div class="prism-html-table-wrap" data-prism-table-root>
<table class="prism-html-table" data-prism-scene="scene-0" data-prism-layer="layer-0" data-prism-page-size="5">
<thead>
<tr>
<th data-prism-field="name">Account</th>
<th data-prism-field="region">Region</th>
<th data-prism-field="revenue">Revenue</th>
</tr>
</thead>
<tbody>
<tr data-prism-datum-row="0">
<td data-prism-sort-value="&#34;Acme&#34;">Acme</td>
<td data-prism-sort-value="&#34;West&#34;">West</td>
<td data-prism-sort-value="120000">120000</td>
</tr>
<tr data-prism-datum-row="1">
<td data-prism-sort-value="&#34;Globex&#34;">Globex</td>
<td data-prism-sort-value="&#34;East&#34;">East</td>
<td data-prism-sort-value="80500">80500</td>
</tr>
<tr data-prism-datum-row="2">
<td data-prism-sort-value="&#34;Initech&#34;">Initech</td>
<td data-prism-sort-value="&#34;South&#34;">South</td>
<td data-prism-sort-value="60250">60250</td>
</tr>
<tr data-prism-datum-row="3">
<td data-prism-sort-value="&#34;Umbrella&#34;">Umbrella</td>
<td data-prism-sort-value="&#34;North&#34;">North</td>
<td data-prism-sort-value="204000">204000</td>
</tr>
<tr data-prism-datum-row="4">
<td data-prism-sort-value="&#34;Soylent&#34;">Soylent</td>
<td data-prism-sort-value="&#34;West&#34;">West</td>
<td data-prism-sort-value="41200">41200</td>
</tr>
<tr data-prism-datum-row="5">
<td data-prism-sort-value="&#34;Stark Industries&#34;">Stark Industries</td>
<td data-prism-sort-value="&#34;East&#34;">East</td>
<td data-prism-sort-value="315000">315000</td>
</tr>
<tr data-prism-datum-row="6">
<td data-prism-sort-value="&#34;Wayne Enterprises&#34;">Wayne Enterprises</td>
<td data-prism-sort-value="&#34;North&#34;">North</td>
<td data-prism-sort-value="278400">278400</td>
</tr>
</tbody>
</table>
<div class="prism-html-table-pagination" data-prism-table-pagination>
<button type="button" data-prism-page-prev disabled>Prev</button>
<span data-prism-page-indicator>Page 1 of 2</span>
<button type="button" data-prism-page-next>Next</button>
</div>
</div>

</body>
</html>
