        <rect class="prism-mark-bar" data-prism-id="bar-1" data-prism-datum-row="1" data-prism-mark-key="brand_id=beta" x="169.5" y="248.9" width="111" height="311.1" rx="3" fill="#f58518"/>
        <rect class="prism-mark-bar" data-prism-id="bar-2" data-prism-datum-row="2" data-prism-mark-key="brand_id=gamma" x="292.833" y="182.6" width="111" height="377.4" rx="3" fill="#e45756"/>
